name: Cloud Gaming API Gateway (5h Auto-Restart)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Run Gateway Hub & Cloudflare Tunnel (5 Hours)
        env:
          PORT: '8000'
          GH_PAT: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2

          node tunnel.js &
          TUNNEL_PID=$!

          echo "Gateway active! Running for 4 hours 50 minutes..."
          sleep 17400

          kill $TUNNEL_PID || true
          kill $SERVER_PID || true

      - name: Trigger Auto-Restart Next Cycle
        if: always()
        run: |
          echo "Triggering next 5-hour cycle..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gateway.yml/dispatches" \
            -d '{"ref":"main"}' || true
